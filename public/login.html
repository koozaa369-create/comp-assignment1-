<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ | Password Manager</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-600/10 text-indigo-500 mb-4 border border-indigo-500/20">
        <i class="fa-solid fa-vault text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-wide">KeyVault</h1>
      <p class="text-xs text-slate-400 mt-1">ระบบจัดการรหัสผ่านส่วนบุคคลแบบปลอดภัยสูง</p>
    </div>

    <!-- Tab Switcher -->
    <div class="flex border-b border-slate-800 mb-6">
      <button id="tab-login-btn" onclick="switchTab('login')" class="flex-1 py-2 text-center text-sm font-semibold text-indigo-400 border-b-2 border-indigo-500 transition-all">
        เข้าสู่ระบบ
      </button>
      <button id="tab-register-btn" onclick="switchTab('register')" class="flex-1 py-2 text-center text-sm font-semibold text-slate-400 hover:text-slate-200 border-b-2 border-transparent transition-all">
        ลงทะเบียน
      </button>
    </div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">ชื่อผู้ใช้ (Username)</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i class="fa-regular fa-user"></i></span>
          <input type="text" id="login-username" required class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-indigo-500 transition" placeholder="กรอกชื่อผู้ใช้">
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Master Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i class="fa-solid fa-key"></i></span>
          <input type="password" id="login-master-pass" required class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-indigo-500 transition" placeholder="••••••••••••">
        </div>
      </div>

      <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-sm shadow-lg shadow-indigo-600/20 transition duration-200 mt-2">
        เข้าสู่ระบบ
      </button>
    </form>

    <!-- Register Form (Hidden by Default) -->
    <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">ชื่อผู้ใช้ (Username)</label>
        <input type="text" id="reg-username" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-indigo-500 transition" placeholder="ตั้งชื่อผู้ใช้">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">อีเมล (Email)</label>
        <input type="email" id="reg-email" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-indigo-500 transition" placeholder="name@domain.com">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Master Password</label>
        <input type="password" id="reg-master-pass" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-indigo-500 transition" placeholder="ตั้งรหัสผ่านหลัก">
      </div>

      <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl text-sm shadow-lg shadow-emerald-600/20 transition duration-200 mt-2">
        สร้างบัญชีใหม่
      </button>
    </form>
  </div>

  <script src="/js/crypto.js"></script>
  <script>
    function switchTab(tab) {
      const loginForm = document.getElementById('login-form');
      const regForm = document.getElementById('register-form');
      const loginBtn = document.getElementById('tab-login-btn');
      const regBtn = document.getElementById('tab-register-btn');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        loginBtn.className = "flex-1 py-2 text-center text-sm font-semibold text-indigo-400 border-b-2 border-indigo-500 transition-all";
        regBtn.className = "flex-1 py-2 text-center text-sm font-semibold text-slate-400 hover:text-slate-200 border-b-2 border-transparent transition-all";
      } else {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        regBtn.className = "flex-1 py-2 text-center text-sm font-semibold text-indigo-400 border-b-2 border-indigo-500 transition-all";
        loginBtn.className = "flex-1 py-2 text-center text-sm font-semibold text-slate-400 hover:text-slate-200 border-b-2 border-transparent transition-all";
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value;
      const masterPassword = document.getElementById('login-master-pass').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, masterPassword })
        });
        const data = await res.json();

        if (data.success) {
          // สร้าง User Key Half ฝั่ง Client ด้วย PBKDF2
          const userKeyHalf = await generateUserKeyHalf(masterPassword, data.userSalt);
          sessionStorage.setItem('clientUserKey', userKeyHalf);
          window.location.href = '/dashboard.html';
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการเข้าสู่ระบบ: ' + err.message);
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('reg-username').value;
      const email = document.getElementById('reg-email').value;
      const masterPassword = document.getElementById('reg-master-pass').value;

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, masterPassword })
        });
        const data = await res.json();

        if (data.success) {
          alert('ลงทะเบียนสำเร็จ! กรุณาเข้าสู่ระบบ');
          switchTab('login');
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการลงทะเบียน: ' + err.message);
      }
    }
  </script>
</body>
</html>
